<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Usuário</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="body-centered">

    <div class="login-container">
        <h1>Registrar</h1>

        <form method="post" th:action="@{/registro}">

            <div class="form-group">
                <label for="email">Email:</label>
                <input id="email" name="email" type="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha:</label>
                <input id="senha" name="senha" type="password" placeholder="Sua senha" required>
            </div>

            <button type="submit" class="btn-primary btn-full-width">
                Registrar
            </button>

            <div class="form-group-checkbox" style="margin-top: 15px; text-align: center; display: block;">
                <a th:href="@{/login}">Já possui uma conta? Faça Login</a>
            </div>
        </form>
    </div>

</body>

</html>
